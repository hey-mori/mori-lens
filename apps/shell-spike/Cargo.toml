[package]
name = "shell-spike"
version = "0.1.0"
edition = "2021"
publish = false

# **Not a workspace member.** `scripts/check.sh` runs
# `cargo clippy --workspace --all-targets` and `cargo test --workspace`, so a
# member is a crate the gate builds before every commit. This crate brings 383
# of them (`docs/benchmarks/2026-08-13-what-a-webview-weighs.md`) and the
# product brings 22. Excluding it in the root manifest keeps that number where
# it is until somebody decides otherwise.

[dependencies]
tauri = "2"
lens-platform-windows = { path = "../../crates/platform-windows" }
lens-core = { path = "../../crates/lens-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "2"
