[package]
name = "hover-probe"
description = "Milestone 1 measurement instrument: what Mori Lens can read under the pointer, and how fast."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
lens-core.workspace = true

[target.'cfg(windows)'.dependencies]
lens-platform-windows.workspace = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Console",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true

[build-dependencies]
lens-build-stamp = { path = "../../crates/build-stamp" }
