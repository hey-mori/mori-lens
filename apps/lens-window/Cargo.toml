[package]
name = "lens-window"
description = "Mori Lens main window: settings, diagnostics, and model management via Tauri."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
repository = "https://github.com/swarea/mori-lens"

# **Not a workspace member.** The gate runs across the workspace, and this
# crate would take it from 23 crates to 384. Excluded until the Tauri
# dependency is accepted for the product binary as well.

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lens-core = { path = "../../crates/lens-core" }

[build-dependencies]
tauri-build = "2"
