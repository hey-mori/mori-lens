<!doctype html>
<meta charset="utf-8">
<title>Mori Lens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font: 14px system-ui, -apple-system, sans-serif;
    padding: 24px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 18px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 16px 0 8px; color: #555; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 16px; }
  td { padding: 4px 8px; border-bottom: 1px solid #eee; }
  td:first-child { color: #666; width: 40%; }
  .stat { display: inline-block; margin-right: 24px; }
  .stat-value { font-size: 24px; font-weight: 600; }
  .stat-label { font-size: 12px; color: #888; }
  .loading { color: #888; padding: 40px; text-align: center; }
  .refusal-row td:last-child { text-align: right; color: #666; }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #e0e0e0; }
    h2 { color: #aaa; }
    td { border-bottom-color: #333; }
    td:first-child { color: #999; }
    .stat-label { color: #777; }
    .loading { color: #666; }
  }
</style>
<body>
  <h1>Mori Lens</h1>
  <div id="content">
    <p class="loading">Loading...</p>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;

    async function load() {
      const diag = await invoke('get_diagnostics');
      const el = document.getElementById('content');

      if (!diag) {
        el.innerHTML = '<p class="loading">No diagnostics data. Start Mori Lens first.</p>';
        return;
      }

      let html = '';

      // Session stats
      html += '<h2>This session</h2>';
      html += '<div style="margin-bottom:16px">';
      html += `<span class="stat"><span class="stat-value">${diag.cards}</span> <span class="stat-label">cards</span></span>`;
      html += `<span class="stat"><span class="stat-value">${diag.settled_hovers}</span> <span class="stat-label">settled hovers</span></span>`;
      html += '</div>';

      // Refusals
      if (diag.refusals && diag.refusals.length > 0) {
        html += '<h2>Refusals</h2>';
        html += '<table>';
        for (const [reason, count] of diag.refusals) {
          const pct = diag.settled_hovers > 0
            ? Math.round(count / diag.settled_hovers * 100)
            : 0;
          html += `<tr class="refusal-row"><td>${reason}</td><td>${count} (${pct}%)</td></tr>`;
        }
        html += '</table>';
      }

      // Configuration
      if (diag.configuration && diag.configuration.length > 0) {
        html += '<h2>Configuration</h2>';
        html += '<table>';
        for (const [label, value] of diag.configuration) {
          html += `<tr><td>${label}</td><td>${value}</td></tr>`;
        }
        html += '</table>';
      }

      // Build
      html += `<p style="font-size:12px;color:#999;margin-top:16px">build ${diag.build}</p>`;

      el.innerHTML = html;
    }

    load();
  </script>
</body>
