[package]
name = "lens"
description = "Mori Lens: rest the pointer on a sentence and read it in your language."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false
repository = "https://github.com/swarea/mori-lens"

# **Not a workspace member.** Tauri v2 takes the workspace from 23 crates to
# 384, and the product binary now depends on Tauri for its main window
# (#164, #165). Excluded until a lighter alternative exists.

[dependencies]
lens-core = { path = "../../crates/lens-core" }
lens-platform-windows = { path = "../../crates/platform-windows" }
lens-translate = { path = "../../crates/lens-translate" }
lens-settings = { path = "../../crates/lens-settings" }
lens-storage = { path = "../../crates/lens-storage" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[build-dependencies]
lens-build-stamp = { path = "../../crates/build-stamp" }
tauri-build = "2"
