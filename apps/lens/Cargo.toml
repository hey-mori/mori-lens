[package]
name = "lens"
description = "Mori Lens: rest the pointer on a sentence and read it in your language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lens-core.workspace = true
lens-platform-windows.workspace = true
lens-translate.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_UI_Shell",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true

[build-dependencies]
lens-build-stamp = { path = "../../crates/build-stamp" }
tauri-build = "2"
