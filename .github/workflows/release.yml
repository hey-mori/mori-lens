# Release workflow.
#
# Builds the NSIS installer when a version tag is pushed, then creates a
# GitHub Release with the installer attached. The tag must match the version
# in Cargo.toml and tauri.conf.json.
#
# CODE SIGNING: not configured. The Windows certificate must be imported as
# GitHub secrets (WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD) before
# signing can be enabled. See docs/release-checklist.md for the procedure.
#
# AUTO-UPDATE: not configured. Tauri v2 updater needs a publishing endpoint
# and a private key. See docs/release-checklist.md for the setup steps.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build NSIS installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Verify version consistency
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' apps/lens/Cargo.toml | cut -d'"' -f2)
          TAURI_VERSION=$(jq -r '.version' apps/lens/tauri.conf.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ] || [ "$TAURI_VERSION" != "$TAG_VERSION" ]; then
            echo "version mismatch: cargo=$CARGO_VERSION tauri=$TAURI_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "version $TAG_VERSION verified"

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build installer
        run: cargo tauri build --bundles nsis

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd apps/lens/target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            apps/lens/target/release/bundle/nsis/*.exe
            apps/lens/target/release/bundle/nsis/SHA256SUMS.txt

  build-macos:
    name: Build .app bundle (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build .app bundle
        run: cargo tauri build --bundles app

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd apps/lens/target/release/bundle/macos
          shasum -a 256 *.app > SHA256SUMS.txt || echo "no .app found" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            apps/lens/target/release/bundle/macos/

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/**/*
            artifacts/macos/**/*
          body: |
            ## UNSIGNED DEVELOPMENT ARTIFACTS

            These builds are **not code-signed**.
            - **Windows**: SmartScreen will show a warning. Verify SHA-256 before running.
            - **macOS**: Gatekeeper will block the unsigned .app. Right-click → Open to bypass, or verify SHA-256.

            Apple Developer ID signing and notarization require external credentials (not yet configured).
          generate_release_notes: true
          draft: true
