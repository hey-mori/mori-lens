# Release workflow.
#
# Builds Windows distribution artifacts when a version tag is pushed, and
# creates a draft GitHub Release that a maintainer publishes by hand:
#   - NSIS installer (.exe)
#   - MSIX package (Store-preparation artifact)
# Then creates a GitHub Release with all artifacts + SHA-256 manifests.
#
# v0.1.0 is Windows-only. macOS build verification remains in package-smoke.yml.
#
# The tag must match the version in Cargo.toml and tauri.conf.json. A release
# candidate tag, vX.Y.Z-rc.N, builds the same X.Y.Z artifacts and marks the
# draft as a pre-release, so a candidate can be installed and checked before
# the final tag exists.
#
# CODE SIGNING: not configured. The Windows certificate must be imported as
# GitHub secrets (WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD) before
# signing can be enabled. See docs/release-checklist.md for the procedure.
#
# AUTO-UPDATE: not configured. Tauri v2 updater needs a publishing endpoint
# and a private key. See docs/release-checklist.md for the setup steps.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build NSIS installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci --prefix apps/lens

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Verify production assets
        shell: bash
        run: |
          # Install pinned asset toolchain
          python -m pip install -r scripts/requirements-assets.txt
          # Run comprehensive production asset verification
          python scripts/verify-product-assets.py

      - name: Verify version consistency
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' apps/lens/Cargo.toml | cut -d'"' -f2)
          TAURI_VERSION=$(jq -r '.version' apps/lens/tauri.conf.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-rc.*}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ] || [ "$TAURI_VERSION" != "$TAG_VERSION" ]; then
            echo "version mismatch: cargo=$CARGO_VERSION tauri=$TAURI_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "version $TAG_VERSION verified"

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build installer
        working-directory: apps/lens
        run: cargo tauri build --bundles nsis

      - name: Verify installer exists
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%%-rc.*}"
          EXE="apps/lens/target/release/bundle/nsis/Mori Lens_${VERSION}_x64-setup.exe"
          if [ ! -f "$EXE" ]; then
            echo "ERROR: NSIS installer not found: $EXE"
            exit 1
          fi
          echo "Found: $EXE"

      - name: Verify installer (structural)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v') -replace '-rc\.\d+$', ''
          $exe = "apps/lens/target/release/bundle/nsis/Mori Lens_${version}_x64-setup.exe"
          $payload = "apps/lens/target/release/lens.exe"
          if (-not (Test-Path $exe)) { Write-Error "NSIS installer not found: $exe"; exit 1 }
          if (-not (Test-Path $payload)) { Write-Error "Payload not found: $payload"; exit 1 }
          & .\scripts\verify-nsis.ps1 -ExePath $exe -PayloadExePath $payload -ExpectedVersion $version

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd apps/lens/target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            apps/lens/target/release/bundle/nsis/*.exe
            apps/lens/target/release/bundle/nsis/SHA256SUMS.txt

  build-msix:
    name: Build MSIX package (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Verify production assets
        shell: bash
        run: |
          # Install pinned asset toolchain
          python -m pip install -r scripts/requirements-assets.txt
          # Run comprehensive production asset verification
          python scripts/verify-product-assets.py

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build release binary
        run: cargo build --release --manifest-path apps/lens/Cargo.toml

      - name: Package MSIX
        shell: powershell
        run: .\scripts\package-msix.ps1

      - name: Verify MSIX
        shell: powershell
        run: |
          $msix = Get-ChildItem target\msix\*.msix | Select-Object -First 1
          if (-not $msix) { Write-Error "MSIX not found"; exit 1 }
          & .\scripts\verify-msix.ps1 $msix.FullName

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix
          path: |
            target/msix/*.msix
            target/msix/*.sha256

  release:
    name: Create GitHub Release
    needs: [build-windows, build-msix]
    # Only this job publishes, so only this job can write.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-msix
          path: artifacts/msix

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/windows/SHA256SUMS.txt
            artifacts/msix/*.msix
            artifacts/msix/*.sha256
          body: |
            ## UNSIGNED DEVELOPMENT ARTIFACTS

            These builds are **not code-signed**.
            - **Windows (NSIS)**: SmartScreen will show a warning. Verify SHA-256 before running.
            - **Windows (MSIX)**: Structurally valid for Store submission. Publisher identity uses placeholder values.

            Microsoft Store submission requires a Store developer account and publisher identity replacement.

            **Note**: macOS support is planned for a future release. The macOS implementation exists in the source tree but has not been runtime-verified.
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
