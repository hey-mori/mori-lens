# Release workflow.
#
# Builds platform-specific artifacts when a version tag is pushed:
#   - Windows: NSIS installer (.exe)
#   - macOS: .app bundle (zipped, unsigned)
# Then creates a GitHub Release with all artifacts + SHA-256 manifests.
#
# The tag must match the version in Cargo.toml and tauri.conf.json.
#
# CODE SIGNING: not configured. The Windows certificate must be imported as
# GitHub secrets (WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD) before
# signing can be enabled. See docs/release-checklist.md for the procedure.
#
# AUTO-UPDATE: not configured. Tauri v2 updater needs a publishing endpoint
# and a private key. See docs/release-checklist.md for the setup steps.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build NSIS installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Verify version consistency
        shell: bash
        run: |
          CARGO_VERSION=$(grep -m1 '^version' apps/lens/Cargo.toml | cut -d'"' -f2)
          TAURI_VERSION=$(jq -r '.version' apps/lens/tauri.conf.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ] || [ "$TAURI_VERSION" != "$TAG_VERSION" ]; then
            echo "version mismatch: cargo=$CARGO_VERSION tauri=$TAURI_VERSION tag=$TAG_VERSION"
            exit 1
          fi
          echo "version $TAG_VERSION verified"

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build installer
        run: cargo tauri build --bundles nsis

      - name: Verify installer exists
        shell: bash
        run: |
          EXE=$(find apps/lens/target/release/bundle/nsis -maxdepth 1 -name "*.exe" -type f | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: NSIS installer not found in apps/lens/target/release/bundle/nsis/"
            exit 1
          fi
          echo "Found: $EXE"

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          cd apps/lens/target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd -

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: |
            apps/lens/target/release/bundle/nsis/*.exe
            apps/lens/target/release/bundle/nsis/SHA256SUMS.txt

  build-macos:
    name: Build .app bundle (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Run checks
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build .app bundle
        run: cargo tauri build --bundles app

      - name: Verify .app exists
        shell: bash
        run: |
          APP_DIR=$(find apps/lens/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: .app bundle not found in apps/lens/target/release/bundle/macos/"
            exit 1
          fi
          echo "Found: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Create zip artifact
        shell: bash
        run: |
          APP_NAME=$(basename "$APP_DIR")
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP_NAME="Mori-Lens-${VERSION}-macos-arm64.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -la "$ZIP_NAME"

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          shasum -a 256 "$ZIP_NAME" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            ${{ env.ZIP_NAME }}
            SHA256SUMS.txt

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/windows/SHA256SUMS.txt
            artifacts/macos/*.zip
            artifacts/macos/SHA256SUMS.txt
          body: |
            ## UNSIGNED DEVELOPMENT ARTIFACTS

            These builds are **not code-signed**.
            - **Windows**: SmartScreen will show a warning. Verify SHA-256 before running.
            - **macOS**: Gatekeeper will block the unsigned .app. Right-click → Open to bypass, or verify SHA-256.

            Apple Developer ID signing and notarization require external credentials (not yet configured).
          generate_release_notes: true
          draft: true
