# Continuous integration.
#
# This workflow deliberately runs `scripts/check.sh` rather than listing the
# verification commands itself. That script is also what a contributor runs
# locally, so there is exactly one definition of "verified" and local and CI
# cannot drift apart.
#
# TRIGGER STATE: every push to main and every pull request.
#
# The triggers were manual-only while the repository was private, because
# Actions on a private repository is metered and rejected runs had put a red X
# on every commit. Public, standard GitHub-hosted runners are free.
#
# Every job runs on a GitHub-hosted runner. A pull request from a fork runs with
# the read-only token below and no secrets, on a machine discarded afterwards,
# and its first run waits for a maintainer's approval. No job may target a
# self-hosted runner: a fork can change this file in its own pull request.
#
# The real gate is still `scripts/check.sh`, recorded in each pull request
# under "How it was verified" (docs/git-workflow.md §9); CI adds a clean-checkout
# signal on top.
#
# WHAT CI CANNOT DO HERE: the acquisition adapter needs a live desktop with a
# focused window, so no runner can verify it. Windows-hosted jobs compile it and
# nothing more. That gap is covered by the probe run required in the pull
# request template, not by pretending a green build is evidence.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-windows:
    name: scripts/check.sh (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix apps/lens
      - run: bash scripts/check.sh --full
        shell: bash

  verify-macos:
    name: scripts/check.sh (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --prefix apps/lens
      - run: bash scripts/check.sh --full
        shell: bash
