# Package smoke test.
#
# Builds actual distributable packages on CI to prove the packaging
# infrastructure works. This is NOT a release — no GitHub Release is
# created, no version tag is required, no signing is attempted.
#
# Artifacts:
#   - Windows: NSIS installer (.exe)
#   - Windows: MSIX package (structural smoke, placeholder publisher)
#   - macOS: .app bundle (unsigned)
#
# Trigger: manual only (workflow_dispatch).
name: package-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-packages:
    name: Windows packages (NSIS + MSIX)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Run verification gate
        shell: bash
        run: bash scripts/check.sh --full

      # --- NSIS ---
      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis

      - name: Verify NSIS installer
        shell: bash
        run: |
          EXE=$(find apps/lens/target/release/bundle/nsis -maxdepth 1 -name "*.exe" -type f | head -1)
          if [ -z "$EXE" ]; then
            echo "ERROR: NSIS installer not found"
            exit 1
          fi
          SIZE=$(stat -c%s "$EXE" 2>/dev/null || stat -f%z "$EXE")
          echo "NSIS installer: $EXE ($SIZE bytes)"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: installer suspiciously small (< 1MB)"
            exit 1
          fi

      - name: Generate NSIS SHA-256
        shell: bash
        run: |
          cd apps/lens/target/release/bundle/nsis
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --- MSIX ---
      - name: Build MSIX package
        shell: pwsh
        run: |
          # Create minimal smoke assets (1x1 PNGs) for packaging
          $assetsDir = "packaging\windows-msix\Assets"
          $pngHeader = [byte[]]@(0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A,0x00,0x00,0x00,0x0D,0x49,0x48,0x44,0x52,0x00,0x00,0x00,0x01,0x00,0x00,0x00,0x01,0x08,0x02,0x00,0x00,0x00,0x90,0x77,0x53,0xDE,0x00,0x00,0x00,0x0C,0x49,0x44,0x41,0x54,0x08,0xD7,0x63,0xF8,0xCF,0xC0,0x00,0x00,0x00,0x02,0x00,0x01,0xE2,0x21,0xBC,0x33,0x00,0x00,0x00,0x00,0x49,0x45,0x4E,0x44,0xAE,0x42,0x60,0x82)
          foreach ($name in @("StoreLogo.png","Square44x44Logo.png","Square150x150Logo.png","Wide310x150Logo.png")) {
            [System.IO.File]::WriteAllBytes("$assetsDir\$name", $pngHeader)
          }
          Write-Host "Smoke assets created"

          # Run the packaging script
          & .\scripts\package-msix.ps1

      - name: Verify MSIX package
        shell: pwsh
        run: |
          $msix = Get-ChildItem target\msix\*.msix | Select-Object -First 1
          if (-not $msix) {
            Write-Error "MSIX package not found"
            exit 1
          }
          Write-Host "MSIX: $($msix.FullName) ($($msix.Length) bytes)"
          & .\scripts\verify-msix.ps1 $msix.FullName

      - name: Generate MSIX SHA-256
        shell: bash
        run: |
          cd target/msix
          sha256sum *.msix > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # --- Upload ---
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            apps/lens/target/release/bundle/nsis/*.exe
            apps/lens/target/release/bundle/nsis/SHA256SUMS.txt
            target/msix/*.msix
            target/msix/SHA256SUMS.txt

  macos-package:
    name: macOS .app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Run verification gate
        shell: bash
        run: bash scripts/check.sh --full

      - name: Build .app bundle
        run: cargo tauri build --bundles app

      - name: Inspect .app bundle
        shell: bash
        run: |
          APP_DIR=$(find apps/lens/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: .app bundle not found"
            exit 1
          fi
          echo "=== .app bundle: $APP_DIR ==="

          # Check binary
          BINARY="$APP_DIR/Contents/MacOS/lens"
          if [ -f "$BINARY" ]; then
            echo "Binary: $(file "$BINARY")"
            echo "Size: $(stat -f%z "$BINARY") bytes"
          else
            echo "ERROR: binary not found at $BINARY"
            exit 1
          fi

          # Check Info.plist
          PLIST="$APP_DIR/Contents/Info.plist"
          if [ -f "$PLIST" ]; then
            echo "Info.plist: present"
            # Extract key fields
            echo "---"
            echo "Bundle ID: $(plutil -extract CFBundleIdentifier raw "$PLIST" 2>/dev/null || echo 'N/A')"
            echo "Version: $(plutil -extract CFBundleShortVersionString raw "$PLIST" 2>/dev/null || echo 'N/A')"
            echo "Min macOS: $(plutil -extract LSMinimumSystemVersion raw "$PLIST" 2>/dev/null || echo 'N/A')"
            echo "---"
          else
            echo "ERROR: Info.plist not found"
            exit 1
          fi

          # Check signing state
          echo "Signing state:"
          codesign -dv "$APP_DIR" 2>&1 || echo "UNSIGNED (expected)"

      - name: Create zip and hash
        shell: bash
        run: |
          APP_DIR=$(find apps/lens/target/release/bundle/macos -maxdepth 1 -name "*.app" -type d | head -1)
          APP_NAME=$(basename "$APP_DIR")
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          ZIP_NAME="Mori-Lens-${VERSION}-macos.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > SHA256SUMS.txt
          echo "ZIP: $ZIP_NAME ($(stat -f%z "$ZIP_NAME") bytes)"
          cat SHA256SUMS.txt

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: |
            Mori-Lens-*.app.zip
            SHA256SUMS.txt
