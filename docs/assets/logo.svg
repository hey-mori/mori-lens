<?xml version="1.0" encoding="UTF-8"?>
<!-- Mori Lens logo · dark panels with light on the floor -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- background -->
  <rect width="200" height="260" fill="#fafafa"/>

  <!-- left panel · dark slate -->
  <polygon points="55,90 90,65 90,190 55,190" fill="#282f33"/>

  <!-- right panel (frame shape) · dark slate -->
  <polygon points="95,45 145,65 145,190 125,190 125,85 95,72" fill="#282f33"/>

  <!-- left floor · dark slate -->
  <polygon points="30,220 60,195 95,195 105,220" fill="#282f33"/>

  <!-- right floor · warm yellow (light from the opening) -->
  <polygon points="100,220 110,195 150,195 175,220" fill="#fde68a"/>
</svg>
