[workspace]
resolver = "2"
members = [
  "crates/build-stamp",
  "crates/lens-core",
  "crates/lens-settings",
  "crates/lens-translate",
  "crates/platform-windows",
  "apps/hover-probe",
]
# **Deliberately not a member.** The gate runs across the workspace, and
# Tauri would take it from 23 crates to 384. Excluded until the Tauri
# dependency is accepted for the product binary.
exclude = ["apps/lens"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Not an SPDX identifier -- it is an npm convention -- and kept because it is the
# statement that was actually made. `publish = false` is what prevents a release;
# the string above only describes one.
license = "UNLICENSED"
publish = false
repository = "https://github.com/swarea/mori-lens"

[workspace.dependencies]
lens-core = { path = "crates/lens-core" }
lens-platform-windows = { path = "crates/platform-windows" }
lens-translate = { path = "crates/lens-translate" }
unicode-segmentation = "1.13"
toml_edit = "0.22"
sha2 = "0.10"

[workspace.lints.rust]
# An unsafe block without a stated invariant does not merge (CLAUDE.md).
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
