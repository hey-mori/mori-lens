[workspace]
resolver = "2"
members = [
  "crates/build-stamp",
  "crates/lens-core",
  "crates/lens-translate",
  "crates/platform-windows",
  "apps/hover-probe",
  "apps/lens",
]
# **Deliberately not a member.** See apps/shell-spike/Cargo.toml: the gate runs
# across the workspace, and this crate would take it from 22 crates to 383.
exclude = ["apps/shell-spike"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Not an SPDX identifier -- it is an npm convention -- and kept because it is the
# statement that was actually made. `publish = false` is what prevents a release;
# the string above only describes one.
license = "UNLICENSED"
publish = false
repository = "https://github.com/swarea/mori-lens"

[workspace.dependencies]
lens-core = { path = "crates/lens-core" }
lens-platform-windows = { path = "crates/platform-windows" }
lens-translate = { path = "crates/lens-translate" }
unicode-segmentation = "1.13"

[workspace.lints.rust]
# An unsafe block without a stated invariant does not merge (CLAUDE.md).
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
