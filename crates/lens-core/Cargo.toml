[package]
name = "lens-core"
description = "Platform-neutral domain for Mori Lens: hover intent, text segmentation, acquisition contract."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No OS crates. Ever. See docs/decisions/ADR-0003-rust-core-platform-adapters.md: a
# dependency on `windows` or `objc` here is what makes the macOS adapter a
# rewrite instead of a new file.
[dependencies]
unicode-segmentation.workspace = true
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
