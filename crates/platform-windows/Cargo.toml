[package]
name = "lens-platform-windows"
description = "Windows UI Automation text acquisition for Mori Lens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lens-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
  "Win32_Foundation",
  # ClientToScreen lives under Gdi, not WindowsAndMessaging, despite operating
  # on a window handle.
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  # PrintWindow, which lives under Xps rather than WindowsAndMessaging.
  "Win32_Storage_Xps",
  "Win32_System_Com",
  # The clipboard, and the global memory its data has to be handed to.
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  # VK_ESCAPE, the one key the welcome window answers to.
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
