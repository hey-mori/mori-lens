[package]
name = "lens-platform-windows"
description = "Windows UI Automation text acquisition for Mori Lens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lens-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  # ClientToScreen lives under Gdi, not WindowsAndMessaging, despite operating
  # on a window handle.
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[lints]
workspace = true
